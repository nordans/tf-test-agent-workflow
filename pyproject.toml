[project]
name = "tf-test-agent-workflow"
version = "0.1.0"
description = "A controlled agent for generating and verifying mocked Terraform tests."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lark==1.3.1",
    "pydantic==2.14.1",
    "python-hcl2==8.1.4",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
required-version = "==0.13.6"
# Run from this repository; publishing an installable package is out of scope.
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
