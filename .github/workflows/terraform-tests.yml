name: Terraform mocked tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  log-analytics-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Build approved Terraform and provider runtime
        run: uv run --locked --no-dev python -B -m test_agent.build_runtime

      - name: Verify reviewed tests and retention mutation
        run: uv run --locked --no-dev python -B -m test_agent.verify > verification.json

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-analytics-workspace-verification
          path: verification.json
          if-no-files-found: warn
          retention-days: 7
