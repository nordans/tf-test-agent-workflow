name: PR test agent

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number targeting main
        required: true
        type: number

permissions: {}

concurrency:
  group: pr-test-agent-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.context.outputs.eligible }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-agent
      - name: Read immutable PR source snapshots
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --no-dev python -B -m test_agent.pr_workflow prepare
      - name: Install trusted secret scanner
        if: steps.context.outputs.eligible == 'true'
        run: bash .github/scripts/install-security-tool.sh betterleaks
      - name: Scan source before sending it to Gemini
        if: steps.context.outputs.eligible == 'true'
        run: >-
          betterleaks dir out/scan --redact=100 --no-banner --no-color
          --ignore-gitleaks-allow --timeout 120
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-context
          path: out/context.json
          if-no-files-found: error
          retention-days: 7

  propose:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verify: ${{ steps.author.outputs.verify }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-agent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-context
          path: incoming
      - name: Analyze changes and propose tests
        id: author
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run --locked --no-dev python -B -m test_agent.pr_workflow draft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pr-draft
          path: out/draft.json
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: [prepare, propose]
    if: needs.propose.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-agent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pr-*
          merge-multiple: true
          path: incoming
      - name: Build trusted execution image
        run: uv run --locked --no-dev python -B -m test_agent.build_runtime
      - name: Verify baseline, existing tests, proposal and negative control
        run: uv run --locked --no-dev python -B -m test_agent.pr_workflow verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pr-result
          path: out/
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [prepare, propose, verify]
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-agent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pr-*
          merge-multiple: true
          path: incoming
      - name: Publish a bounded report to the originating PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          AUTHOR_RESULT: ${{ needs.propose.result }}
          VERIFIER_RESULT: ${{ needs.verify.result }}
        run: uv run --locked --no-dev python -B -m test_agent.pr_workflow publish
