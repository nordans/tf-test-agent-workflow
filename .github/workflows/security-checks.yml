name: Security checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-validation:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install checksum-pinned Actionlint
        run: bash .github/scripts/install-security-tool.sh actionlint

      - name: Validate workflows and embedded shell
        run: |
          actionlint -color
          shellcheck .github/scripts/*.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checksum-pinned Betterleaks
        run: bash .github/scripts/install-security-tool.sh betterleaks

      - name: Scan Git history with full redaction
        run: >-
          betterleaks git . --log-opts=--all --redact=100 --no-banner --no-color
          --ignore-gitleaks-allow --timeout 120

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Install locked audit dependencies
        run: uv sync --locked --group audit

      - name: Export all dependency groups from the lock file
        run: >-
          uv export --locked --all-groups --no-emit-project --format requirements-txt
          --output-file "$RUNNER_TEMP/audit-requirements.txt" > /dev/null

      - name: Audit pinned dependencies without resolving or installing them
        run: >-
          uv run --locked --group audit pip-audit
          --requirement "$RUNNER_TEMP/audit-requirements.txt" --disable-pip --require-hashes
          --strict --progress-spinner off --format json --output dependency-audit.json

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 7
